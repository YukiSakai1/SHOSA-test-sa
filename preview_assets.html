<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Asset Preview</title>
<style>
  body { background: #333; color: #fff; font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 20px; }
  .card { background: #fff; color: #111; padding: 10px; border-radius: 8px; text-align: center; }
  img { max-width: 320px; max-height: 200px; display: block; margin: 0 auto 8px; background: #eee; }
  .name { font-size: 12px; font-weight: bold; word-break: break-all; }
</style>
</head>
<body>
<script>
const files = [
  "WELCOME TO.png",
  "Group 221.png",
  "Group 208.png",
  "Layer_1.png",
  "Layer_1 (1).png",
  "Frame 160.png",
  "Frame 119.png",
  "Group 333.png",
  "medal.png",
  "Vector.png",
  "Union.png",
  "Group.png",
  "Frame 140.png",
  "Group 224.png",
  "Group 225.png",
  "Frame 255.png",
  "d9b30b3df4c884e8aa0d44f55a288bb0d7a2429e.png",
  "Frame 100.png",
  "Frame 100 (1).png",
  "Frame 100 (2).png",
  "Frame 110.png",
  "Frame 110 (1).png",
  "Frame 110 (2).png",
  "Frame 111.png",
  "Frame 111 (1).png",
  "Frame 112.png",
  "Frame 112 (1).png",
  "Frame 113.png",
  "Frame 113 (1).png",
  "Frame 113 (2).png",
  "Frame 114.png"
];
files.forEach(f => {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<img src="assets/images/${encodeURIComponent(f)}"><div class="name">${f}</div>`;
  document.body.appendChild(div);
});
</script>
</body>
</html>
